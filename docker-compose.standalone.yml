services:
  postgres:
    image: postgres:16-alpine
    container_name: navratna-dev-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uaip}
      POSTGRES_USER: ${POSTGRES_USER:-uaip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uaip_password}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-uaip,uaip_test}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uaip_user} -d ${POSTGRES_DB:-uaip}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2025.04.0-community-bullseye
    container_name: navratna-dev-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/uaip_dev_password}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-uaip_dev_password}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ./database/neo4j/init:/docker-entrypoint-initdb.d
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-uaip_dev_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: navratna-dev-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:8-alpine
    container_name: navratna-dev-redis
    command: redis-server --protected-mode yes --bind 0.0.0.0 --requirepass ${REDIS_PASSWORD:-uaip_redis_password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-uaip_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-uaip_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: navratna-dev-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  navratna-core:
    build:
      context: .
      dockerfile: Dockerfile.base
      target: development
    container_name: navratna-dev-navratna-core
    environment:
      SERVICE_NAME: agent-intelligence
      SERVICE_PORT: 3001
      NODE_ENV: development
      PORT: 3001
      POSTGRES_URL: postgresql://${POSTGRES_USER:-uaip_user}:${POSTGRES_PASSWORD:-uaip_password}@postgres:5432/${POSTGRES_DB:-uaip}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-uaip_dev_password}
      REDIS_URL: redis://:${REDIS_PASSWORD:-uaip_redis_password}@redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3001:3001"
    volumes:
      - ./packages:/app/packages
      - ./backend/shared:/app/backend/shared
      - ./backend/services/agent-intelligence:/app/backend/services/agent-intelligence
      - /app/node_modules
      - /app/backend/node_modules
      - /app/backend/shared/services/node_modules
      - /app/backend/shared/middleware/node_modules
      - /app/backend/shared/config/node_modules
      - /app/backend/shared/llm-service/node_modules
      - /app/backend/services/agent-intelligence/node_modules
      - /app/packages/shared-types/node_modules
      - /app/packages/shared-utils/node_modules
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis
      - ollama
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  navratna-gateway:
    build:
      context: .
      dockerfile: Dockerfile.base
      target: development
    container_name: navratna-dev-navratna-gateway
    environment:
      SERVICE_NAME: security-gateway
      SERVICE_PORT: 3002
      NODE_ENV: development
      PORT: 3002
      POSTGRES_URL: postgresql://${POSTGRES_USER:-uaip_user}:${POSTGRES_PASSWORD:-uaip_password}@postgres:5432/${POSTGRES_DB:-uaip}
      REDIS_URL: redis://:${REDIS_PASSWORD:-uaip_redis_password}@redis:6379
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-uaip_dev_password}
      JWT_SECRET: ${JWT_SECRET:-uaip_dev_jwt_secret_key_change_in_production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY}
      OPENAI_API_URL: ${OPENAI_API_URL}
      OLLAMA_URL: http://ollama:11434
    ports:
      - "3002:3002"
    volumes:
      - ./packages:/app/packages
      - ./backend/shared:/app/backend/shared
      - ./backend/services/security-gateway:/app/backend/services/security-gateway
      - /app/node_modules
      - /app/backend/node_modules
      - /app/backend/shared/services/node_modules
      - /app/backend/shared/middleware/node_modules
      - /app/backend/shared/config/node_modules
      - /app/backend/shared/llm-service/node_modules
      - /app/backend/services/security-gateway/node_modules
      - /app/packages/shared-types/node_modules
      - /app/packages/shared-utils/node_modules
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis
      - ollama
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  artifact-service:
    build:
      context: .
      dockerfile: Dockerfile.base
      target: development
    container_name: navratna-dev-artifact-service
    environment:
      SERVICE_NAME: artifact-service
      SERVICE_PORT: 3006
      NODE_ENV: development
      PORT: 3006
      POSTGRES_URL: postgresql://${POSTGRES_USER:-uaip_user}:${POSTGRES_PASSWORD:-uaip_password}@postgres:5432/${POSTGRES_DB:-uaip}
      REDIS_URL: redis://:${REDIS_PASSWORD:-uaip_redis_password}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_URL: ${OPENAI_API_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "3006:3006"
    volumes:
      - ./packages:/app/packages
      - ./backend/shared:/app/backend/shared
      - ./backend/services/artifact-service:/app/backend/services/artifact-service
      - /app/node_modules
      - /app/backend/node_modules
      - /app/backend/shared/services/node_modules
      - /app/backend/shared/middleware/node_modules
      - /app/backend/shared/config/node_modules
      - /app/backend/shared/llm-service/node_modules
      - /app/backend/services/artifact-service/node_modules
      - /app/packages/shared-types/node_modules
      - /app/packages/shared-utils/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telescope:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: navratna-dev-telescope
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:8081
      VITE_API_TARGET: http://nginx:80
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./apps/frontend/vite.config.ts:/app/apps/frontend/vite.config.ts
      - ./apps/frontend/tailwind.config.ts:/app/apps/frontend/tailwind.config.ts
      - ./apps/frontend/postcss.config.js:/app/apps/frontend/postcss.config.js
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/frontend/node_modules
    depends_on:
      - navratna-core
      - navratna-gateway
      - artifact-service
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD-SHELL", "timeout 5s sh -c '</dev/tcp/localhost/5173'"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: navratna-dev-nginx
    ports:
      - "8081:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/frontend/dist:/var/www/html:ro
    depends_on:
      - navratna-core
      - navratna-gateway
      - artifact-service
      - telescope
    networks:
      - navratna-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: navratna-dev-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring:/etc/prometheus/config:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/config/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
    networks:
      - navratna-internal
    profiles:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: navratna-dev-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - navratna-internal
    profiles:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  qdrant_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  navratna-internal:
    name: navratna-internal
    driver: bridge
