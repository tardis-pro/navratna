name = "navratna-api-gateway"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Drop the CF-Containers-era NavratnaStack Durable Object (no longer used).
[[migrations]]
tag = "v2-drop-container-do"
deleted_classes = ["NavratnaStack"]

# =============================================================================
# Production — edge API gateway for api.navratna.tardis.digital
# Path-splits to the two Fly.io apps and injects verified X-User-* headers.
# =============================================================================
[env.production]
name = "navratna-api-gateway"
routes = [{ pattern = "api.navratna.tardis.digital", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"
CORE_URL = "https://navratna-core.fly.dev"
GATEWAY_URL = "https://navratna-gateway.fly.dev"
FRONTEND_URL = "https://navratna.tardis.digital"
CORS_ORIGINS = "https://navratna.tardis.digital,https://navratna-23w.pages.dev"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "navratna-storage-prod"

# =============================================================================
# Development (local wrangler dev)
# =============================================================================
[env.development.vars]
ENVIRONMENT = "development"
CORE_URL = "http://localhost:3001"
GATEWAY_URL = "http://localhost:3002"
FRONTEND_URL = "http://localhost:5173"
CORS_ORIGINS = "http://localhost:5173,http://localhost:3000"
