# tardis.local edge router — SPA + /api/v1 path-split, mirroring
# deploy/cloudflare/src/worker.ts ROUTE_TABLE. Runs in nginx-unprivileged
# (listen 8080, non-root); this file is included inside the stock http{} block.
#
# Edge-trust contract (attachNginxAuth): backends trust X-User-* only when the
# request carries X-Edge-Auth matching EDGE_AUTH_SECRET. The entrypoint renders
# edge_secret.conf from $EDGE_AUTH_SECRET at boot; every proxied location sets
# X-Edge-Auth and ALWAYS overwrites X-User-* — blank on public routes,
# auth_request-derived on authenticated ones — so a client can never smuggle a
# forged identity through.

# Which backend answers an API path. Longest/most specific regex first.
map $uri $api_upstream {
    default                                 navratna_gateway;
    ~^/api/v1/llm/my-providers              navratna_gateway;
    ~^/api/v1/agent-llm-providers           navratna_gateway;
    ~^/api/v1/knowledge/constellations      navratna_core;
    ~^/api/v1/knowledge/ingest              navratna_core;
    ~^/api/v1/(agents|personas|discussions|artifacts|info|onboarding|onboard|compositions|composition|task-dags|questionforge|llm)(/|$) navratna_core;
    ~^/api/v1/user/llm                      navratna_core;
}

upstream navratna_core {
    server navratna-core:8080 max_fails=3 fail_timeout=10s;
}

upstream navratna_gateway {
    server navratna-gateway:8080 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Prefer Authorization header, fall back to the access_token cookie for the
# auth_request subrequest (same contract as api-gateway/nginx.conf).
map $cookie_access_token $auth_fallback_header {
    default "Bearer $cookie_access_token";
}

map $http_authorization $auth_header {
    default $http_authorization;
    ""      $auth_fallback_header;
}

server {
    listen 8080;
    server_tokens off;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Identity extraction: one subrequest to the gateway validates the JWT and
    # returns X-User-* headers.
    location = /_internal/auth/validate {
        internal;
        proxy_pass http://navratna_gateway/api/v1/auth/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Host $host;
        proxy_set_header Authorization $auth_header;
    }

    # ── SPA (built bundle baked into this image) ────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Public API prefixes (pre-authentication, no auth_request) ───────────
    location /api/v1/auth {
        proxy_pass http://navratna_gateway;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/v1/oauth {
        proxy_pass http://navratna_gateway;
        include /etc/nginx/proxy_common.conf;
    }

    location /.well-known/ {
        proxy_pass http://navratna_gateway;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/v1/artifacts/public {
        proxy_pass http://navratna_core;
        include /etc/nginx/proxy_common.conf;
    }

    # ── Inbound webhooks — HMAC-authenticated IN THE APP, not at the edge ───
    #
    # These must be pre-authentication or they are unreachable by the systems
    # they exist for. They previously sat under `location /api/`, which requires
    # an auth_request session JWT, so GitHub, Jira and any workflow-webhook
    # caller got a flat 401 from nginx and never reached the handler. The
    # receivers were complete — signature verification, event routing, CI
    # monitoring — and could not be called. Same reasoning as /socket.io above:
    # auth is handled in-app, so the edge passes through.
    #
    # This is NOT an unauthenticated hole. Each route verifies an HMAC-SHA256
    # signature over the raw body against a shared secret, and each is only
    # MOUNTED when its secret is configured (GITHUB_WEBHOOK_SECRET,
    # JIRA_WEBHOOK_SECRET, WORKFLOW_WEBHOOK_SECRET) — an unconfigured deploy has
    # no route at all rather than one that always refuses.
    #
    # The identity headers are blanked exactly as /socket.io blanks them: a
    # caller here is not a user, and must never be able to present one.
    location /api/v1/webhooks/ {
        proxy_pass http://navratna_gateway;
        include /etc/nginx/proxy_common.conf;
        include /tmp/edge_secret.conf;
        proxy_set_header X-User-ID "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Org "";
    }

    # Project provisioning for `tardis init`. EXACT match (`location =`), so it
    # covers this one path and nothing else — /api/v1/projects and every route
    # under it keep their session gate for every method, including POST.
    #
    # It is a separate path rather than `POST /api/v1/projects` because nginx
    # cannot scope auth_request by method: the directive takes a literal URI or
    # `off` and does not accept a variable, and the if()-based workarounds either
    # cannot contain auth_request or inherit the surrounding one. A conditional
    # that silently resolves the wrong way is not acceptable in front of the
    # endpoint that mints project identity.
    #
    # The handler verifies x-navratna-service-token itself and fails closed when
    # PROJECT_PROVISION_TOKEN is unset, so this location is defence in depth, not
    # the security boundary. Identity headers are blanked as elsewhere: a service
    # caller is not a user and must not be able to present one.
    location = /api/v1/projects/provision {
        proxy_pass http://navratna_gateway;
        include /etc/nginx/proxy_common.conf;
        include /tmp/edge_secret.conf;
        proxy_set_header X-User-ID "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Org "";
    }

    # Repository ingest for `tardis init`. Same shape and same reasoning as
    # /projects/provision above: EXACT match, so every other /api/v1/knowledge
    # path keeps its session gate.
    #
    # The handler verifies x-navratna-service-token itself — it accepts EITHER an
    # authenticated person or the platform, and refuses anyone who is neither —
    # so this location is defence in depth rather than the boundary.
    #
    # It exists because the handler was otherwise unreachable. The app-level 401
    # was cleared and the edge still answered first, which a status code alone
    # cannot reveal: the edge returns 401 as text/html, the handler returns JSON.
    # That content-type difference is the only way to tell which wall you hit,
    # and it is why "the blocker is cleared" was true of one wall and false of
    # the request.
    #
    # The upstream is $api_upstream, which already maps this path to
    # navratna_core — the gateway does not serve it at all.
    location = /api/v1/knowledge/ingest {
        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy_common.conf;
        include /tmp/edge_secret.conf;
        proxy_set_header X-User-ID "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Org "";

        # A clone-and-parse of a real repository is not a 60-second request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Workflow definitions with trigger.kind 'webhook'. The path segment is the
    # routing key; WorkflowEngineService resolves it to a definition only AFTER
    # the signature verifies, so an unsigned caller cannot probe which keys exist.
    location /api/v1/workflows/hooks/ {
        proxy_pass http://navratna_gateway;
        include /etc/nginx/proxy_common.conf;
        include /tmp/edge_secret.conf;
        proxy_set_header X-User-ID "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Org "";
    }

    # Short-link resolver
    location /s/ {
        proxy_pass http://navratna_core;
        include /etc/nginx/proxy_common.conf;
    }

    # Socket.IO — websocket passthrough to core (auth handled in-app)
    location /socket.io {
        proxy_pass http://navratna_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /tmp/edge_secret.conf;
        # Socket.IO auth is in-app (token handshake); never forward a
        # client-supplied identity alongside the edge stamp.
        proxy_set_header X-User-ID "";
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Org "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Authenticated API — everything else under /api ──────────────────────
    location /api/ {
        auth_request /_internal/auth/validate;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_email $upstream_http_x_user_email;
        auth_request_set $auth_user_role $upstream_http_x_user_role;
        auth_request_set $auth_user_org $upstream_http_x_user_org;

        proxy_pass http://$api_upstream;
        include /etc/nginx/proxy_common.conf;

        # Forward the validated identity; overwrites anything client-sent.
        include /tmp/edge_secret.conf;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-User-Email $auth_user_email;
        proxy_set_header X-User-Role $auth_user_role;
        proxy_set_header X-User-Org $auth_user_org;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
