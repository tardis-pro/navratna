app = 'navratna-gateway'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.gateway'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/health'
