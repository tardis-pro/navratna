name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - gateway
          - frontend
          - edge

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.12.1'

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Gate: only deploy after a successful CI run (or explicit manual dispatch).
  # Resolves the trusted commit SHA and the deployment target so every artifact
  # is built and released from the exact same commit.
  # ──────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Prepare deployment
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve trusted SHA and target
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "Refusing to deploy: CI run concluded '${{ github.event.workflow_run.conclusion }}' (expected success)." >&2
              exit 1
            fi
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "target=all" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────────
  # Fly.io core: build SHA-tagged image, push to the Fly registry, deploy the
  # exact image, verify public /health, and cut a Sentry release.
  # Runs in parallel with deploy-gateway (both depend only on prepare).
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-core:
    name: Deploy navratna-core (Fly)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.target == 'all' || needs.prepare.outputs.target == 'core'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Fly registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/fly/Dockerfile.core
          push: true
          tags: registry.fly.io/navratna-core:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=navratna-core
          cache-to: type=gha,scope=navratna-core,mode=max

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 (tag 1.6)
        with:
          version: 0.4.74

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app navratna-core \
            --config deploy/fly/fly.core.toml \
            --image registry.fly.io/navratna-core:${{ needs.prepare.outputs.sha }} \
            --strategy rolling \
            --wait-timeout 5m \
            --env SERVICE_VERSION=${{ needs.prepare.outputs.sha }} \
            --yes

      - name: Verify health
        run: |
          URL="https://navratna-core.fly.dev/health"
          for i in 1 2 3; do
            echo "Health check attempt ${i}/3: ${URL}"
            if curl -sf --max-time 15 "${URL}"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt ${i} failed, waiting 15s..."
            sleep 15
          done
          echo "Health check failed after 3 attempts."
          exit 1

      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_CORE_PROJECT }}
        with:
          release: ${{ needs.prepare.outputs.sha }}
          environment: production
          set_commits: auto
          ignore_missing: true
          ignore_empty: true

  # ──────────────────────────────────────────────────────────────────────────────
  # Fly.io gateway: build SHA-tagged image, push to the Fly registry, deploy the
  # exact image, verify public /health, and cut a Sentry release.
  # Runs in parallel with deploy-core (both depend only on prepare).
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-gateway:
    name: Deploy navratna-gateway (Fly)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.target == 'all' || needs.prepare.outputs.target == 'gateway'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Fly registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/fly/Dockerfile.gateway
          push: true
          tags: registry.fly.io/navratna-gateway:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=navratna-gateway
          cache-to: type=gha,scope=navratna-gateway,mode=max

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1 (tag 1.6)
        with:
          version: 0.4.74

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app navratna-gateway \
            --config deploy/fly/fly.gateway.toml \
            --image registry.fly.io/navratna-gateway:${{ needs.prepare.outputs.sha }} \
            --strategy rolling \
            --wait-timeout 5m \
            --env SERVICE_VERSION=${{ needs.prepare.outputs.sha }} \
            --yes

      - name: Verify health
        run: |
          URL="https://navratna-gateway.fly.dev/health"
          for i in 1 2 3; do
            echo "Health check attempt ${i}/3: ${URL}"
            if curl -sf --max-time 15 "${URL}"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt ${i} failed, waiting 15s..."
            sleep 15
          done
          echo "Health check failed after 3 attempts."
          exit 1

      - name: Create Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_GATEWAY_PROJECT }}
        with:
          release: ${{ needs.prepare.outputs.sha }}
          environment: production
          set_commits: auto
          ignore_missing: true
          ignore_empty: true

  # ──────────────────────────────────────────────────────────────────────────────
  # Frontend: build the SPA with hidden source maps, cut a Sentry release with
  # source-map upload (maps deleted from dist afterwards), then publish to
  # Cloudflare Pages pinned to the deploy commit.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Cloudflare Pages)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.target == 'all' || needs.prepare.outputs.target == 'frontend'
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:shared

      - name: Build frontend
        env:
          NODE_ENV: production
          # Baked in at build time — the bundle must point at the production API
          # origin or every request falls back to the Pages domain and 404s.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.navratna.tardis.digital' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_APP_VERSION: ${{ needs.prepare.outputs.sha }}
        run: pnpm build:frontend

      - name: Create Sentry release & upload source maps
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_FRONTEND_PROJECT }}
        with:
          release: ${{ needs.prepare.outputs.sha }}
          environment: production
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
          sourcemaps: apps/frontend/dist

      - name: Delete source map files
        run: find apps/frontend/dist -name '*.map' -type f -delete

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          command: pages deploy apps/frontend/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'navratna' }} --branch=main --commit-hash=${{ needs.prepare.outputs.sha }}

      - name: Verify production domain
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 https://navratna.tardis.digital/ > /dev/null
          echo "Frontend production domain is reachable."

  # ──────────────────────────────────────────────────────────────────────────────
  # Edge: Cloudflare API Worker (deploy/cloudflare) → production environment.
  # Installs via the pnpm workspace (wrangler resolves from node_modules) so no
  # ad-hoc npm install runs inside the workspace package.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-edge:
    name: Deploy Edge Worker (Cloudflare)
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.target == 'all' || needs.prepare.outputs.target == 'edge'
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          packageManager: pnpm
          command: deploy --env production

      - name: Verify production domain
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 https://api.navratna.tardis.digital/health > /dev/null
          echo "Edge API production domain is reachable."
