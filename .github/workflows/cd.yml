name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

permissions:
  contents: read
  packages: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Build & push Docker images for all 4 services
  # ──────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - navratna-core
          - navratna-gateway
          - basebench-meta
          - questionforge
        include:
          - service: navratna-core
            port: 3001
          - service: navratna-gateway
            port: 3002
          - service: basebench-meta
            port: 3009
          - service: questionforge
            port: 3010
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Build & deploy frontend to Cloudflare Pages
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm build:shared

      - name: Build frontend
        run: pnpm build:frontend
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontend/dist --project-name=navratna --branch=${{ github.ref_name }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy to staging (on push to main or manual staging dispatch)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy ${{ matrix.service }} to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event.inputs.environment == 'staging'
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        service:
          - navratna-core
          - navratna-gateway
          - basebench-meta
          - questionforge
        include:
          - service: navratna-core
            port: 3001
          - service: navratna-gateway
            port: 3002
          - service: basebench-meta
            port: 3009
          - service: questionforge
            port: 3010
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve image tag
        id: image
        run: |
          SHA="${{ github.sha }}"
          IMAGE="${{ env.IMAGE_BASE }}/${{ matrix.service }}:${SHA:0:7}"
          echo "tag=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Fly.io (staging)
        run: |
          flyctl deploy \
            --app tardis-${{ matrix.service }}-staging \
            --image ${{ steps.image.outputs.tag }} \
            --strategy rolling \
            --wait-timeout 300 \
            --no-cache

      - name: Verify health (staging)
        run: |
          URL="https://tardis-${{ matrix.service }}-staging.fly.dev/health"
          for i in 1 2 3; do
            echo "Health check attempt ${i}/3: ${URL}"
            if curl -sf --max-time 15 "${URL}"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt ${i} failed, waiting 10s..."
            sleep 10
          done
          echo "Health check failed after 3 attempts."
          exit 1

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy to production (on version tags or manual production dispatch)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy ${{ matrix.service }} to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.environment == 'production'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        service:
          - navratna-core
          - navratna-gateway
          - basebench-meta
          - questionforge
        include:
          - service: navratna-core
            port: 3001
          - service: navratna-gateway
            port: 3002
          - service: basebench-meta
            port: 3009
          - service: questionforge
            port: 3010
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve image tag
        id: image
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            # Strip leading 'v' for semver tag
            IMAGE="${{ env.IMAGE_BASE }}/${{ matrix.service }}:${TAG#v}"
          else
            SHA="${{ github.sha }}"
            IMAGE="${{ env.IMAGE_BASE }}/${{ matrix.service }}:${SHA:0:7}"
          fi
          echo "tag=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Capture current release for rollback
        id: rollback
        run: |
          CURRENT=$(flyctl status --app tardis-${{ matrix.service }} --json 2>/dev/null | jq -r '.Deployment.ID // empty' || true)
          echo "release=${CURRENT}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Fly.io (production)
        run: |
          flyctl deploy \
            --app tardis-${{ matrix.service }} \
            --image ${{ steps.image.outputs.tag }} \
            --strategy rolling \
            --wait-timeout 300 \
            --no-cache

      - name: Verify health (production)
        id: healthcheck
        run: |
          URL="https://tardis-${{ matrix.service }}.fly.dev/health"
          for i in 1 2 3; do
            echo "Health check attempt ${i}/3: ${URL}"
            if curl -sf --max-time 15 "${URL}"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt ${i} failed, waiting 15s..."
            sleep 15
          done
          echo "Health check failed after 3 attempts."
          exit 1

      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "Rolling back tardis-${{ matrix.service }} to previous release..."
          PREVIOUS="${{ steps.rollback.outputs.release }}"
          if [ -n "${PREVIOUS}" ]; then
            flyctl releases rollback --app tardis-${{ matrix.service }}
            echo "Rollback initiated."
          else
            echo "No previous release found. Manual intervention required."
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────────
  # Post-deploy smoke test — verify all services are healthy
  # ──────────────────────────────────────────────────────────────────────────────
  post-deploy-verification:
    name: Post-Deploy Health Verification
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=-staging" >> "$GITHUB_OUTPUT"
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify all service health endpoints
        run: |
          SUFFIX="${{ steps.env.outputs.suffix }}"
          ENV="${{ steps.env.outputs.env }}"
          SERVICES=("navratna-core" "navratna-gateway" "basebench-meta" "questionforge")
          FAILED=0

          echo "Running post-deploy verification for ${ENV}..."
          echo ""

          for SERVICE in "${SERVICES[@]}"; do
            URL="https://tardis-${SERVICE}${SUFFIX}.fly.dev/health"
            echo "Checking ${SERVICE} at ${URL}..."
            HEALTHY=false

            for i in 1 2 3; do
              if curl -sf --max-time 15 "${URL}" > /dev/null 2>&1; then
                echo "  [PASS] ${SERVICE} is healthy"
                HEALTHY=true
                break
              fi
              echo "  Attempt ${i}/3 failed, retrying in 10s..."
              sleep 10
            done

            if [ "${HEALTHY}" = false ]; then
              echo "  [FAIL] ${SERVICE} is unhealthy after 3 retries"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          if [ "${FAILED}" -gt 0 ]; then
            echo "${FAILED} service(s) failed health check."
            exit 1
          fi
          echo "All services healthy in ${ENV}."

  # ──────────────────────────────────────────────────────────────────────────────
  # Notify on completion
  # ──────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, deploy-frontend, post-deploy-verification]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.post-deploy-verification.result }}" == "failure" ]]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "text=Deployment verification failed" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "text=Production deployment complete" >> "$GITHUB_OUTPUT"
          elif [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "text=Staging deployment complete" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "text=Deployment failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          text: "${{ steps.status.outputs.text }} — ${{ github.repository }}@${{ github.ref_name }} (${{ github.sha }})"
          channel: '#deployments'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
