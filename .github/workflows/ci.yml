name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CI: true
  NX_DAEMON: false
  NODE_VERSION: '24'
  PNPM_VERSION: '10.12.1'

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

  static:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve diff range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE_SHA="$EVENT_BEFORE"
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse HEAD^)"
            fi
            HEAD_SHA="$GITHUB_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$GITHUB_SHA"
          fi
          {
            echo "BASE_SHA=$BASE_SHA"
            echo "HEAD_SHA=$HEAD_SHA"
          } >> "$GITHUB_ENV"
          echo "Diff range: $BASE_SHA..$HEAD_SHA"

      - name: Lint changed files
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
              -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs'
          )
          if [ "${#files[@]}" -gt 0 ]; then
            printf 'Linting %d changed file(s)\n' "${#files[@]}"
            pnpm exec oxlint "${files[@]}"
          else
            echo "No changed JS/TS files to lint."
          fi

      - name: Format-check changed files
        run: |
          mapfile -d '' -t files < <(
            git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
              -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' \
                 '*.json' '*.jsonc' '*.yml' '*.yaml' '*.md' '*.css' '*.toml'
          )
          if [ "${#files[@]}" -gt 0 ]; then
            printf 'Format-checking %d changed file(s)\n' "${#files[@]}"
            pnpm exec oxfmt --check "${files[@]}"
          else
            echo "No changed supported files to format-check."
          fi

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all projects
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild shared packages
        run: pnpm build:shared

      - name: Run tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pnpm nx affected -t test --base="$PR_BASE_SHA" --head="$PR_HEAD_SHA"
          else
            pnpm test
          fi

  containers:
    name: Container ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: navratna-core
            dockerfile: deploy/fly/Dockerfile.core
          - image: navratna-gateway
            dockerfile: deploy/fly/Dockerfile.gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
