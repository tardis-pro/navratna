version: 2
updates:
  # Root workspace (frontend + NX tooling)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'your-team'
    assignees:
      - 'your-team'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      radix:
        patterns:
          - '@radix-ui/*'
      dev-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'

  # Shared packages
  - package-ecosystem: 'npm'
    directory: '/apps/packages/shared-types'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(shared-types)'

  - package-ecosystem: 'npm'
    directory: '/apps/packages/shared-utils'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(shared-utils)'

  - package-ecosystem: 'npm'
    directory: '/apps/shared/services'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(shared-services)'

  - package-ecosystem: 'npm'
    directory: '/apps/shared/middleware'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(shared-middleware)'

  - package-ecosystem: 'npm'
    directory: '/apps/shared/config'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(shared-config)'

  - package-ecosystem: 'npm'
    directory: '/apps/shared/infra'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(infra)'

  # Backend services (v3 consolidated)
  - package-ecosystem: 'npm'
    directory: '/apps/backend/services/navratna-core'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(navratna-core)'

  - package-ecosystem: 'npm'
    directory: '/apps/backend/services/navratna-gateway'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(navratna-gateway)'

  - package-ecosystem: 'npm'
    directory: '/apps/backend/services/questionforge'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(questionforge)'

  - package-ecosystem: 'npm'
    directory: '/apps/backend/services/basebench-meta'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(basebench-meta)'

  # Docker dependencies
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(docker)'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'friday'
      time: '09:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
