services:
  navratna-gateway:
    image: uaip-backend-base:latest
    container_name: navratna-pcb-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVICE_NAME: security-gateway
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD:-uaip_redis_password}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-uaip_redis_password}
      PC_A_CONTROL_PLANE_URL: ${PC_A_CONTROL_PLANE_URL:-http://100.64.0.10:8081}
      PC_A_CAPABILITY_REGISTRY_URL: ${PC_A_CAPABILITY_REGISTRY_URL:-http://100.64.0.10:3003}
      PC_A_ORCHESTRATION_URL: ${PC_A_ORCHESTRATION_URL:-http://100.64.0.10:3002}
    ports:
      - '3002:3002'
    depends_on:
      - redis
    networks:
      - navratna-internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3002/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: navratna-pcb-nginx
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;
          server_name _;

          location /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
          }

          location / {
            proxy_pass http://navratna-gateway:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
          }
        }
        EOF
        nginx -g 'daemon off;'
    ports:
      - '8081:80'
    depends_on:
      - navratna-gateway
    networks:
      - navratna-internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: navratna-pcb-redis
    command: redis-server --appendonly yes --protected-mode yes --bind 0.0.0.0 --requirepass ${REDIS_PASSWORD:-uaip_redis_password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-uaip_redis_password}
    ports:
      - '6380:6379'
    volumes:
      - pcb_redis_data:/data
    networks:
      - navratna-internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-uaip_redis_password}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  openshell-k3s-placeholder:
    image: alpine:3.20
    container_name: navratna-pcb-openshell-placeholder
    command:
      - /bin/sh
      - -c
      - |
        echo 'OpenShell K3s is installed on the PC-B host (not in Docker).'
        echo 'Expected host install path: /opt/openshell (adjust to your setup).'
        tail -f /dev/null
    environment:
      OPEN_SHELL_INSTALL_MODE: host
      OPEN_SHELL_HOST_PATH: ${OPEN_SHELL_HOST_PATH:-/opt/openshell}
      OPEN_SHELL_KUBECONFIG: ${OPEN_SHELL_KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}
      OPEN_SHELL_NOTES: Runs on host and reaches PC-A over Tailscale
    volumes:
      - /opt/openshell:/host/openshell:ro
    networks:
      - navratna-internal
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'test -d /host/openshell || test -d ${OPEN_SHELL_HOST_PATH:-/opt/openshell}']
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  pcb_redis_data:

networks:
  navratna-internal:
    name: navratna-internal
    driver: bridge
