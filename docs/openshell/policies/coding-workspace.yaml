# OpenShell Coding Workspace Policy
# For persistent development environments with full tool access

version: "1.0"
name: coding-workspace
terms: []

sandbox:
  type: persistent
  timeout: 3600  # 1 hour max
  max_instances: 10

resources:
  cpu: 4
  memory: 8Gi
  gpu: 1  # Optional, set to 0 if not needed

filesystem:
  read_only: false
  allowed_paths:
    - /data/repos/*  # Repository volumes
    - /data/cache/*  # Shared caches
  denied_paths:
    - /etc/shadow
    - /etc/sudoers
    - /root/.ssh

network:
  egress:
    allowed:
      - github.com
      - api.anthropic.com
      - api.openai.com
      - pc-a-navratna.tailnet:11434
    denied:
      - "*"  # Block all other egress

process:
  allowed:
    - node
    - npm
    - pnpm
    - yarn
    - python
    - pip
    - go
    - cargo
    - rustc
  denied:
    - passwd
    - su
    - sudo

inference:
  providers:
    - ollama
    - anthropic
  default: ollama
  fallback: anthropic
