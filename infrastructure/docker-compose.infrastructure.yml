# version: '3.8'  # Removed obsolete version field

services:
  # Database Services
  postgres:
    image: postgres:18-alpine
    container_name: uaip-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uaip}
      POSTGRES_USER: ${POSTGRES_USER:-uaip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uaip_password}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-uaip,uaip_test}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uaip_user -d uaip']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2025.04.0-community-bullseye
    container_name: uaip-neo4j-dev
    hostname: uaip-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/uaip_dev_password}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - '7474:7474' # HTTP
      - '7687:7687' # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ./database/neo4j/init:/docker-entrypoint-initdb.d
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', 'uaip_dev_password', 'RETURN 1']
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: uaip-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - uaip-network
    command: redis-server --protected-mode yes --bind 0.0.0.0 --requirepass uaip_redis_password
    environment:
      - REDIS_PASSWORD=uaip_redis_password
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'uaip_redis_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Embedding Engine (Qdrant for vector storage)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: uaip-qdrant-dev
    ports:
      - '6333:6333' # HTTP API
      - '6334:6334' # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200"']
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring Stack (Optional for dev)
  prometheus:
    image: prom/prometheus:latest
    container_name: uaip-prometheus-dev
    ports:
      - '9090:9090'
    volumes:
      - ../monitoring:/etc/prometheus/config
      - prometheus_data:/prometheus
    networks:
      - uaip-network
    command:
      - '--config.file=/etc/prometheus/config/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: uaip-grafana-dev
    ports:
      - '3000:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - uaip-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # ==========================================================================
  # SignOZ — Self-hosted APM (traces, metrics, logs via OpenTelemetry)
  # ==========================================================================
  signoz-clickhouse:
    image: clickhouse/clickhouse-server:24.1-alpine
    container_name: uaip-signoz-clickhouse
    volumes:
      - signoz_clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse-config/signoz-databases.sql:/docker-entrypoint-initdb.d/signoz-databases.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --query "SELECT 1"']
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
      - monitoring

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.102.12
    container_name: uaip-otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ../monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'   # OTLP gRPC
      - '4318:4318'   # OTLP HTTP
    environment:
      - SIGNOZ_CLICKHOUSE_HOST=signoz-clickhouse
      - SIGNOZ_CLICKHOUSE_PORT=9000
    networks:
      - uaip-network
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:13133/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - monitoring

  signoz-query-service:
    image: signoz/query-service:0.52.0
    container_name: uaip-signoz-query
    environment:
      - ClickHouseUrl=tcp://signoz-clickhouse:9000
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
    volumes:
      - signoz_query_data:/var/lib/signoz
    networks:
      - uaip-network
    depends_on:
      signoz-clickhouse:
        condition: service_healthy
      signoz-otel-collector:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/api/v1/health | grep -q ok || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - monitoring

  signoz-frontend:
    image: signoz/frontend:0.52.0
    container_name: uaip-signoz-frontend
    ports:
      - '3301:3301'
    environment:
      - FRONTEND_API_ENDPOINT=http://signoz-query-service:8085
    networks:
      - uaip-network
    depends_on:
      - signoz-query-service
    profiles:
      - monitoring

  # ==========================================================================
  # Sentry — Self-hosted error tracking & performance monitoring
  # ==========================================================================

  sentry-kafka:
    image: apache/kafka:3.7.1
    container_name: uaip-sentry-kafka
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@sentry-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://sentry-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - sentry_kafka_data:/var/lib/kafka/data
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    profiles:
      - monitoring

  sentry-snuba-api:
    image: getsentry/snuba:24.6.0
    container_name: uaip-sentry-snuba-api
    environment:
      SNUBA_SETTINGS: docker
      DEFAULT_BROKERS: sentry-kafka:9092
      CLICKHOUSE_HOST: signoz-clickhouse
      REDIS_HOST: sentry-redis
      UWSGI_MAX_REQUESTS: '10000'
      UWSGI_DISABLE_LOGGING: 'true'
    networks:
      - uaip-network
    depends_on:
      sentry-kafka:
        condition: service_healthy
      signoz-clickhouse:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:1218/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - monitoring

  sentry-snuba-consumer:
    image: getsentry/snuba:24.6.0
    container_name: uaip-sentry-snuba-consumer
    command: consumer --storage errors --auto-offset-reset=latest --max-batch-time-ms 750
    environment:
      SNUBA_SETTINGS: docker
      DEFAULT_BROKERS: sentry-kafka:9092
      CLICKHOUSE_HOST: signoz-clickhouse
      REDIS_HOST: sentry-redis
    networks:
      - uaip-network
    depends_on:
      sentry-snuba-api:
        condition: service_healthy
    profiles:
      - monitoring

  sentry-snuba-outcomes-consumer:
    image: getsentry/snuba:24.6.0
    container_name: uaip-sentry-snuba-outcomes
    command: consumer --storage outcomes_raw --auto-offset-reset=earliest --max-batch-time-ms 750
    environment:
      SNUBA_SETTINGS: docker
      DEFAULT_BROKERS: sentry-kafka:9092
      CLICKHOUSE_HOST: signoz-clickhouse
      REDIS_HOST: sentry-redis
    networks:
      - uaip-network
    depends_on:
      sentry-snuba-api:
        condition: service_healthy
    profiles:
      - monitoring

  sentry-snuba-replacer:
    image: getsentry/snuba:24.6.0
    container_name: uaip-sentry-snuba-replacer
    command: replacer --storage errors --auto-offset-reset=latest --max-batch-size 3
    environment:
      SNUBA_SETTINGS: docker
      DEFAULT_BROKERS: sentry-kafka:9092
      CLICKHOUSE_HOST: signoz-clickhouse
      REDIS_HOST: sentry-redis
    networks:
      - uaip-network
    depends_on:
      sentry-snuba-api:
        condition: service_healthy
    profiles:
      - monitoring

  sentry-postgres:
    image: postgres:16-alpine
    container_name: uaip-sentry-postgres
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry_password
      POSTGRES_DB: sentry
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sentry']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - monitoring

  sentry-redis:
    image: redis:8-alpine
    container_name: uaip-sentry-redis
    volumes:
      - sentry_redis_data:/data
    networks:
      - uaip-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - monitoring

  sentry-init:
    image: getsentry/sentry:24.6.0
    container_name: uaip-sentry-init
    command: upgrade --noinput
    environment:
      SENTRY_SECRET_KEY: '${SENTRY_SECRET_KEY:-uaip-sentry-dev-secret-key-change-in-prod}'
    volumes:
      - ./sentry-config/sentry.conf.py:/etc/sentry/sentry.conf.py:ro
    networks:
      - uaip-network
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
      sentry-kafka:
        condition: service_healthy
      sentry-snuba-api:
        condition: service_healthy
    restart: on-failure
    profiles:
      - monitoring

  sentry-web:
    image: getsentry/sentry:24.6.0
    container_name: uaip-sentry-web
    ports:
      - '9000:9000'
    environment:
      SENTRY_SECRET_KEY: '${SENTRY_SECRET_KEY:-uaip-sentry-dev-secret-key-change-in-prod}'
    volumes:
      - ./sentry-config/sentry.conf.py:/etc/sentry/sentry.conf.py:ro
    networks:
      - uaip-network
    depends_on:
      sentry-init:
        condition: service_completed_successfully
    profiles:
      - monitoring

  sentry-worker:
    image: getsentry/sentry:24.6.0
    container_name: uaip-sentry-worker
    command: run worker
    environment:
      SENTRY_SECRET_KEY: '${SENTRY_SECRET_KEY:-uaip-sentry-dev-secret-key-change-in-prod}'
    volumes:
      - ./sentry-config/sentry.conf.py:/etc/sentry/sentry.conf.py:ro
    networks:
      - uaip-network
    depends_on:
      - sentry-web
    profiles:
      - monitoring

  sentry-cron:
    image: getsentry/sentry:24.6.0
    container_name: uaip-sentry-cron
    command: run cron
    environment:
      SENTRY_SECRET_KEY: '${SENTRY_SECRET_KEY:-uaip-sentry-dev-secret-key-change-in-prod}'
    volumes:
      - ./sentry-config/sentry.conf.py:/etc/sentry/sentry.conf.py:ro
    networks:
      - uaip-network
    depends_on:
      - sentry-web
    profiles:
      - monitoring

  sentry-relay:
    image: getsentry/relay:24.6.0
    container_name: uaip-sentry-relay
    ports:
      - '3101:3000'
    volumes:
      - ./sentry-config/relay/config.yml:/work/.relay/config.yml:ro
    networks:
      - uaip-network
    depends_on:
      - sentry-web
    profiles:
      - monitoring

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  qdrant_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  signoz_clickhouse_data:
  signoz_query_data:
  sentry_kafka_data:
  sentry_postgres_data:
  sentry_redis_data:

networks:
  uaip-network:
    driver: bridge
