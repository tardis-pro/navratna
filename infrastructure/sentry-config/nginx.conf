upstream sentry-web {
    server sentry-web:9000;
}

upstream sentry-relay {
    server sentry-relay:3000;
}

server {
    listen 9000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 24k;
    proxy_buffers 64 4k;

    # Route event ingestion through Relay
    # CORS is required here so browser SDKs on dev origins (localhost:5173, etc.) can POST directly.
    location ~ ^/api/[1-9]\d*/envelope/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Sentry-Auth, X-Forwarded-For, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Sentry-Auth, X-Forwarded-For, Accept, Origin" always;
        proxy_pass http://sentry-relay;
    }

    location ~ ^/api/[1-9]\d*/store/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Sentry-Auth, X-Forwarded-For, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Sentry-Auth, X-Forwarded-For, Accept, Origin" always;
        proxy_pass http://sentry-relay;
    }

    location ~ ^/api/[1-9]\d*/minidump/ {
        proxy_pass http://sentry-relay;
    }

    location ~ ^/api/[1-9]\d*/security/ {
        proxy_pass http://sentry-relay;
    }

    # Everything else goes to sentry-web (UI, API, static files)
    location / {
        proxy_pass http://sentry-web;
    }
}
