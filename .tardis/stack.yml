# tardis stack — the deployment contract for this project.
#
#   scope: shared   deployed once per project; every branch uses it.
#   scope: release  deployed per branch. Suffixed on previews.
#
# Previews are intentionally OFF for all services: the router reaches core and
# gateway by their compose DNS names and the SPA bakes its API origin at build
# time, both of which would point a preview at the wrong instances.
#
# Topology mirrors the Fly production layout, minus the CF worker:
#   router (nginx-unprivileged) serves the built SPA and path-splits /api/v1/*
#   between navratna-core and navratna-gateway, validating the JWT once via
#   auth_request and forwarding identity as X-User-* + X-Edge-Auth.
#
# Deliberately NOT deployed here (platform provides or local-only):
#   prometheus / grafana / postgres-exporter  → platform observability
#   basebench-meta / questionforge            → built from a local-only base image
#   api-gateway (nginx) + dev frontend        → folded into `router`
#
# Secrets below are homelab-only literals, freshly generated for this stack —
# they are NOT the Fly production secrets.

volumes:
  - id: postgres-data
    size: 5
  - id: neo4j-data
    size: 5
  - id: neo4j-logs
    size: 2
  - id: neo4j-import
    size: 2
  - id: neo4j-plugins
    size: 2
  - id: redis-data
    size: 2
  - id: qdrant-data
    size: 5

services:
  - id: postgres
    image: postgres:18-alpine
    profile: postgres
    scope: shared
    port: 5432
    memory: 512
    cpu: 200
    env:
      POSTGRES_DB: "uaip"
      POSTGRES_USER: "uaip_user"
      POSTGRES_PASSWORD: "768fe72364e34688a524512f1ffa9c26f8bdc5adca42a3ef"
    mounts:
      - volume: postgres-data
        path: /var/lib/postgresql   # postgres:18 PGDATA lives under /var/lib/postgresql/18/...
    probe: { type: tcp, port: 5432 }

  - id: graph-db
    image: neo4j:2025.04.0-community-bullseye
    profile: generic
    scope: shared
    port: 7687
    memory: 1536
    cpu: 250
    # NOTE: the platform validates env names as UPPER_SNAKE only, so Neo4j's
    # mixed-case setting vars (NEO4J_dbms_*, NEO4J_server_*) cannot be passed.
    # Two consequences, both handled via the command override below:
    #  - k8s injects <SERVICE>_PORT/PORT vars; the entrypoint translates any
    #    NEO4J_*-prefixed env into config keys, so the service must NOT be
    #    named 'neo4j' (renamed graph-db) or startup dies on 'PORT.7687...'.
    #  - auto-sized heap exceeds the 1.5G container limit, so heap/pagecache
    #    are pinned by appending to neo4j.conf before exec'ing the entrypoint
    #    (conf is writable — the APOC install step writes to it already).
    command: ["/bin/bash", "-c"]
    args:
      - >-
        printf 'server.memory.heap.initial_size=512m\nserver.memory.heap.max_size=768m\nserver.memory.pagecache.size=256m\n' >> /var/lib/neo4j/conf/neo4j.conf
        && exec /startup/docker-entrypoint.sh neo4j
    env:
      NEO4J_AUTH: "neo4j/7b51bf8cf6acd79f47f8e6ebb9ce66dd7b789fd15ac7bd7a"
      NEO4J_PLUGINS: '["apoc"]'
    mounts:
      - volume: neo4j-data
        path: /data
      - volume: neo4j-logs
        path: /logs
      - volume: neo4j-import
        path: /var/lib/neo4j/import
      - volume: neo4j-plugins
        path: /plugins
    probe: { type: tcp, port: 7687 }

  - id: redis
    image: redis:8-alpine
    profile: redis
    scope: shared
    port: 6379
    memory: 256
    cpu: 100
    args: ['redis-server', '--protected-mode', 'yes', '--bind', '0.0.0.0', '--requirepass', '0c2c3900623342900e8aab30a659a3098671f7d74b2cf6e3']
    mounts:
      - volume: redis-data
        path: /data
    probe: { type: tcp, port: 6379 }

  - id: qdrant
    image: qdrant/qdrant:v1.14.1
    profile: generic
    scope: shared
    port: 6333
    memory: 512
    cpu: 150
    env:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__STORAGE__SNAPSHOTS_PATH: "/qdrant/storage/snapshots"
      QDRANT__TELEMETRY_DISABLED: "true"
    mounts:
      - volume: qdrant-data
        path: /qdrant/storage
    probe: { type: tcp, port: 6333 }

  - id: navratna-core
    build: { context: ., dockerfile: deploy/fly/Dockerfile.core }
    profile: generic
    scope: release
    # Opt into Prometheus scraping. BaseService already serves
    # prom-client counters + a latency histogram on /metrics; without
    # this the series were emitted every request and thrown away.
    metrics: true
    port: 8080
    memory: 1024          # 512 OOMs under load (same finding as Fly)
    cpu: 250
    # THE BRAIN DOES NOT GET A COLD START.
    #
    # This project is the thing that answers when anything else asks a question,
    # and its own brief sets cold start < 90s and "THOUGHT TO ACTION — the gap
    # should be imperceptible". An interface you wait for is not an interface.
    #
    # Pinned explicitly rather than left to be inferred as routable. A release
    # sleeps on Traefik traffic, and Traefik only counts what entered through
    # the router — core is reached from the router over cluster DNS, so it
    # measures as permanently idle no matter how hard it is being worked.
    #
    # The backing services then follow for free: stackSleepDecision() only
    # sleeps a shared service once EVERY release is asleep, which can no longer
    # happen. So postgres, graph-db, redis and qdrant stay up without needing
    # their own pin — and the graph and vector stores in particular must, since
    # they hold the project knowledge everything else retrieves against.
    sleep: never
    dependsOn: [postgres, graph-db, redis, qdrant]
    # First boot on an empty database: sync the Drizzle schema (no-op when the
    # DB already matches), then start the service. Seeders run in-app at boot.
    args:
      - sh
      - -c
      - "cd /app/apps/shared/services && bun node_modules/drizzle-kit/bin.cjs push --force && cd /app && exec bun apps/backend/services/navratna-core/dist/navratna-core/src/index.js"
    env:
      NODE_ENV: "production"
      NAVRATNA_CORE_PORT: "8080"
      LOG_LEVEL: "info"
      # The same service credential the gateway holds for /provision, because
      # /api/v1/knowledge/ingest lives HERE and now accepts it as an alternative
      # to a human session. Without it that route falls back to demanding a
      # session the provisioner cannot supply, and every project stays registered
      # with an empty graph — which is the state this unblocks. Must stay
      # identical to the gateway's value: it is compared, not merely presented.
      PROJECT_PROVISION_TOKEN: "00a9bc1b69d1ea35d602fa98f78896d5338b3c99656044a1d6e07dee94964f65"
      # Hour-0 error tracking. BaseService.initializeObservability() already
      # calls initSentry(), so the SDK only ever needed a DSN — each app gets
      # its OWN GlitchTip project so an error is attributable to a service
      # rather than to "navratna". The DSN is a write-only ingest key.
      # TLS to sentry.tardis.local works because the platform mounts the
      # homelab CA and sets NODE_EXTRA_CA_CERTS on every workload.
      SENTRY_DSN: "https://94327d1a3c8c4d3e88e673a2d77f2011@sentry.tardis.local/14"
      SENTRY_ENVIRONMENT: "tardis-local"
      DB_SSL: "false"
      POSTGRES_URL: "postgresql://uaip_user:768fe72364e34688a524512f1ffa9c26f8bdc5adca42a3ef@postgres:5432/uaip"
      NEO4J_URL: "bolt://graph-db:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "7b51bf8cf6acd79f47f8e6ebb9ce66dd7b789fd15ac7bd7a"
      REDIS_URL: "redis://:0c2c3900623342900e8aab30a659a3098671f7d74b2cf6e3@redis:6379"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "0c2c3900623342900e8aab30a659a3098671f7d74b2cf6e3"
      QDRANT_URL: "http://qdrant:6333"
      WEBSOCKET_ENABLED: "true"
      JWT_SECRET: "ac06a3e2ec35b813cb4eb1ec6ae153675e2dfdcc9748ee4c"
      JWT_REFRESH_SECRET: "e257007b17030b49f292885f0e92aab4961932cdc5beb99a"
      DELETION_HASH_SALT: "f2a9c1d47e83b06512c4e9a8d7f3b5c1"
      EDGE_AUTH_SECRET: "c84946937277d3a29209f2e3a49d9e7a"
      # RS256 access-token signing key, SHARED by core and gateway.
