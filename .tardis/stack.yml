      JWT_KEY_ID: "navratna-tardis-local-1"
      LLM_PROVIDER_ENCRYPTION_KEY: "1deae090f180e05266037660b8c507afbfa1180369239f5fe789d15bbb71366c"
      EMBEDDINGS_URL: "https://ai.tardis.digital/v1/embeddings"
      EMBEDDINGS_MODEL: "jina/jina-embeddings-v5-text-small"
      EMBEDDINGS_API_KEY: "sk-3909fbf385e370bc-c3b924-cfbfde2c"
      EMBEDDINGS_DIM: "1024"
      QDRANT_VECTOR_DIM: "1024"
      # Repository ingest caches a full checkout per project and keeps it
      # deliberately. Unset, it defaults under tmpdir - which here is an
      # EmptyDir with a sizeLimit, so the first real ingest wrote GBs into
      # /tmp and the kubelet evicted navratna-core (23:24 on 2026-08-15,
      # ~2 GiB written against a steady state of zero). It also re-cloned
      # every project on every restart, since scratch does not survive one.
      #
      # /data is the project's RWX volume and is already mounted. It is
      # hostPath-backed and enforces NO quota - the declared capacity is a
      # label, and the same disk carries Gitea (the origin for the platform
      # repo) and the backups. So this move deliberately ships WITH the cache
      # bound below: without it, an overrun stops evicting one pod and starts
      # filling a shared disk.
      #
      # Gateway does NOT get these: repo ingest lives in core.
      REPO_CACHE_DIR: "/data/repo-cache"
      REPO_CACHE_MAX_BYTES: "5368709120"   # 5 GiB
      REPO_CACHE_TTL_DAYS: "14"
      RERANKING_URL: "https://ai.tardis.digital/v1/rerank"
      RERANKING_MODEL: "jina/jina-reranker-v3"
      OPENAI_API_KEY: "sk-3909fbf385e370bc-c3b924-cfbfde2c"
      GITEA_URL: "https://git.tardis.local"
      ENTERPRISE_MODE: "false"
      ZERO_TRUST_MODE: "disabled"
      # ── WhatsApp (Baileys) ───────────────────────────────────────────────
      # The Baileys client lives in the discussion feature, which only
      # navratna-core mounts — hence these belong here and NOT in the gateway.
      # Agent an unbound contact is routed to before choosing from the menu.
      WHATSAPP_DEFAULT_AGENT_ID: ""
      # Redis logical DB for the WhatsApp session/auth state. Falls back to
      # REDIS_DB then 0; kept separate so clearing a WhatsApp session cannot
      # touch application cache keys.
      REDIS_WA_DB: "0"
      # jid:userId pairs, comma-separated — the ONLY identities allowed to
      # approve an operation by replying over WhatsApp. Same variable as in
      # navratna-gateway, read here in the jid → userId direction.
      # Empty ⇒ an approval reply from ANY number is refused and logged.
      WHATSAPP_APPROVER_ALLOWLIST: ""
    probe: { type: tcp, port: 8080 }

  - id: navratna-gateway
    build: { context: ., dockerfile: deploy/fly/Dockerfile.gateway }
    profile: generic
    scope: release
    # Opt into Prometheus scraping. BaseService already serves
    # prom-client counters + a latency histogram on /metrics; without
    # this the series were emitted every request and thrown away.
    metrics: true
    port: 8080
    memory: 768
    cpu: 250
    # Same reasoning as navratna-core: reached over cluster DNS, invisible to
    # Traefik, so it would be reaped as idle while actively serving.
    sleep: never
    dependsOn: [postgres, graph-db, redis, qdrant]
    env:
      NODE_ENV: "production"
      NAVRATNA_GATEWAY_PORT: "8080"
      LOG_LEVEL: "info"
      # See navratna-core: separate GlitchTip project, separate DSN.
      SENTRY_DSN: "https://9c156f82a30e4f27b13f31ef9997e165@sentry.tardis.local/15"
      SENTRY_ENVIRONMENT: "tardis-local"
      DB_SSL: "false"
      POSTGRES_URL: "postgresql://uaip_user:768fe72364e34688a524512f1ffa9c26f8bdc5adca42a3ef@postgres:5432/uaip"
      NEO4J_URL: "bolt://graph-db:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "7b51bf8cf6acd79f47f8e6ebb9ce66dd7b789fd15ac7bd7a"
      REDIS_URL: "redis://:0c2c3900623342900e8aab30a659a3098671f7d74b2cf6e3@redis:6379"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "0c2c3900623342900e8aab30a659a3098671f7d74b2cf6e3"
      QDRANT_URL: "http://qdrant:6333"
      JWT_SECRET: "ac06a3e2ec35b813cb4eb1ec6ae153675e2dfdcc9748ee4c"
      JWT_REFRESH_SECRET: "e257007b17030b49f292885f0e92aab4961932cdc5beb99a"
      DELETION_HASH_SALT: "f2a9c1d47e83b06512c4e9a8d7f3b5c1"
      EDGE_AUTH_SECRET: "c84946937277d3a29209f2e3a49d9e7a"
      # RS256 access-token signing key, SHARED by core and gateway.
      # Without it each pod auto-generates its own ephemeral RSA pair at boot
      # (see jwks.ts initializeKeyPair), so tokens minted by the gateway fail
      # signature verification in core and EVERY Socket.IO handshake is
      # rejected with "invalid or expired token". HTTP survived only because
      # the router forwards an edge-stamped X-User-ID that sockets refuse.
