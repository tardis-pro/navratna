      JWT_KEY_ID: "navratna-tardis-local-1"
      LLM_PROVIDER_ENCRYPTION_KEY: "1deae090f180e05266037660b8c507afbfa1180369239f5fe789d15bbb71366c"
      # Encrypts the per-server headers of every registered MCP server —
      # including the tardis project capability that lets this brain call its
      # own project's agent.
      #
      # ONLY THE GATEWAY GETS THIS. capability-registry is mounted here
      # (navratna-gateway/src/index.ts imports capabilityFeature), and
      # utils/mcp_secrets.ts states outright that only that service holds the
      # key. navratna-core does not need it and should not have it.
      #
      # IT WAS UNSET, AND THAT CAUSED TWO ERRORS THAT LOOK UNRELATED:
      #   "MCP_SECRETS_KEY must be set to a 64-char hex string (32 bytes)"
      #   "Failed to load MCP config for navratna-tardis-agent"
      #   "Integration catalog discovery failed ... missing or invalid project
      #    capability"
      # The last one reads like a tardis-side auth problem and is not: with no
      # key, the stored Authorization header cannot be decrypted, so the call
      # goes out without a usable capability and the agent correctly refuses it.
      #
      # ROTATING THIS INVALIDATES EVERY STORED MCP HEADER. They are encrypted
      # with it, not derived from it, so a new value means re-entering the
      # credential for every registered MCP server. Generate with
      # `openssl rand -hex 32`.
      MCP_SECRETS_KEY: "b3d8d03abacdd21490dc7ede6f742690d9964f512c82a970602c2e0b0017f455"
      # Signs the inbound ingress for workflow definitions whose trigger.kind is
      # 'webhook' (POST /api/v1/workflows/hooks/:routingKey). Callers must send
      # x-navratna-signature-256: sha256=<HMAC-SHA256 of the raw body>.
      #
      # The route is only MOUNTED when this is set — an unconfigured deploy has
      # no route rather than one that 401s on every request — and
      # verifyHookSignature fails closed if it is somehow absent at request time.
      # A hook can start a workflow, and a workflow can run shell steps, so this
      # path must never be reachable unsigned.
      #
      # Generate with `openssl rand -hex 32`. Rotating it invalidates nothing
      # stored; it only means every caller must be given the new secret.
      WORKFLOW_WEBHOOK_SECRET: "1a7ce3884913a23ae467be87efd1d8416f8c920cbd4839f55f7feb7d32273e8b"
      # Authorises POST /api/v1/projects/provision, the service-credential path
      # `tardis init` uses to mint a Navratna project. The route is only MOUNTED
      # when this is set, and the handler compares the presented
      # x-navratna-service-token against it in constant time, so an unset value
      # means no route rather than an open one.
      #
      # This endpoint creates the row that owns MCP servers (mcp_servers.project_id),
      # so it mints identity — treat the token as a credential, not a config knob.
      # Generate with `openssl rand -hex 32`.
      PROJECT_PROVISION_TOKEN: "00a9bc1b69d1ea35d602fa98f78896d5338b3c99656044a1d6e07dee94964f65"
      # Writes the nightly triage definition (N2) at gateway boot. There is no
      # exec path into this database, so a workflow_definitions row can only
      # arrive with the code that runs it. Idempotent — upserted by name, so a
      # redeploy updates the row instead of adding a second one.
      #
      # THE ROW IS WRITTEN DISABLED whatever this is set to. This flag decides
      # only whether it exists; scheduling it is a separate, deliberate act, so
      # a deploy can never put an unwatched workflow onto production cron.
      SEED_NIGHTLY_TRIAGE: "true"
      # Whose facts the triage gathers. Resolved to a project id by slug at seed
      # time. If nothing matches, the seed writes NOTHING rather than a
      # project-less row: every gather step is a project-scoped MCP tool, and a
      # definition that exists is far easier to mistake for a working one than a
      # definition that was never created.
      TRIAGE_PROJECT_SLUG: "navratna"
      EMBEDDINGS_URL: "https://ai.tardis.digital/v1/embeddings"
      EMBEDDINGS_MODEL: "jina/jina-embeddings-v5-text-small"
      EMBEDDINGS_API_KEY: "sk-3909fbf385e370bc-c3b924-cfbfde2c"
      EMBEDDINGS_DIM: "1024"
      QDRANT_VECTOR_DIM: "1024"
      RERANKING_URL: "https://ai.tardis.digital/v1/rerank"
      RERANKING_MODEL: "jina/jina-reranker-v3"
      OPENAI_API_KEY: "sk-3909fbf385e370bc-c3b924-cfbfde2c"
      GITEA_URL: "https://git.tardis.local"
      OAUTH_CALLBACK_URL: "https://navratna.tardis.local/api/v1/oauth/callback"
      ENTERPRISE_MODE: "false"
      ZERO_TRUST_MODE: "disabled"
      # Where the approval email/in-app notification points the admin. Without
      # this the NotificationService builds {{approvalUrl}} against the
      # localhost:3000 default and every approval link it sends is dead.
      FRONTEND_BASE_URL: "https://navratna.tardis.local"
      # ── Human-in-the-loop approvals ──────────────────────────────────────
      # Approvers notified when an `approval` step suspends an operation.
      # Comma-separated user ids. EMPTY ON PURPOSE: with no approver the
      # approval fails closed (the operation is rejected, never auto-approved).
      # Provision real ids before relying on approval steps.
      APPROVAL_DEFAULT_APPROVERS: ""
      # jid:userId pairs, comma-separated — the ONLY identities allowed to
      # approve over WhatsApp. Deliberately separate from the self-service chat
      # binding in `whatsapp:binding:*`: picking a chat agent and authorising a
      # real-world action are different trust levels.
      # Empty ⇒ nobody can approve over WhatsApp. Mirrored into navratna-core,
      # which reads the same variable in the opposite direction (jid → userId).
      WHATSAPP_APPROVER_ALLOWLIST: ""
      # Enables the `whatsapp` NotificationService channel. Named *_ENABLED
      # because it maps to config.notifications.whatsapp.enabled, not to the
      # config.notifications.channels.* flags that NOTIFICATIONS_EMAIL/SMS set.
      # Only "true" enables it; the gateway publishes notification.whatsapp.send
      # and navratna-core's Baileys client does the actual delivery.
      NOTIFICATIONS_WHATSAPP_ENABLED: "false"
    probe: { type: tcp, port: 8080 }

  - id: router
    build: { context: ., dockerfile: deploy/tardis/router/Dockerfile }
    profile: generic
    scope: release
    port: 8080
    memory: 128
    cpu: 100
    # The one service Traefik does see, so this is the only pin that wake-on-
    # request would have covered. Pinned anyway: waking it on the first request
    # would still make that request pay for the cold start of everything behind
    # it, which is exactly the latency this project is not allowed to have.
    sleep: never
    dependsOn: [navratna-core, navratna-gateway]
    env:
      EDGE_AUTH_SECRET: "c84946937277d3a29209f2e3a49d9e7a"
    probe: { type: tcp, port: 8080 }

# Which service answers which URL path. Longest prefix wins.
routes:
  - { path: /, service: router }
