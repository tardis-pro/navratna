# tardis dev — stacked CI (multi-service projects).
#
# Builds every service in .tardis/stack.lock.json, mirrors third-party images
# into THIS project's registry path, then sends the agent a deployment intent
# containing digests only. No Kubernetes object is constructed here and this
# workflow holds no cluster credentials.
#
# The lock file is produced by `tardis stack plan` and is plain JSON, so CI needs
# only the Python standard library — no pip install, no network dependency.
name: tardis-stack
on:
  push:

jobs:
  # Tests and the coverage ratchet, in PARALLEL with the build.
  #
  # This job did not exist until the ratchet needed somewhere to live, which is
  # why the multi-service projects — the largest ones on the platform — had never
  # run a test or reported a coverage number in CI at all. Their builds were
  # green because nothing was being asked of them.
  #
  # It deliberately does not block the deploy: previews ship in parallel, as they
  # do in the single-image workflow. What it produces is an honest per-job verdict
  # that a pull request can be gated on.
  test:
    # MAIN ONLY. The runner is a single slot, so a test job on every push
    # doubles the queue for every branch and preview — and the coverage
    # baseline is a main-branch high-water mark anyway, so a branch run had
    # nothing to ratchet against that main would not re-check on merge.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: run tests + coverage ratchet
        run: |
          # A monorepo's tests live behind its own script; if there is no `test`
          # script there is nothing to run, and that is not a failure. What IS a
          # failure is a test suite that runs and fails — see the note in
          # workflow.yml about `|| echo "tests failed"`.
          # THE LOCKFILE PICKS THE PACKAGE MANAGER, NOT A GUESS.
          #
          # This ran `npm ci` unconditionally and died instantly on the flagship
          # project here: navratna is a bun workspace, and npm cannot even parse
          # its manifest — `EUNSUPPORTEDPROTOCOL, Unsupported URL Type
          # "catalog:"`. Every push then paid for a doomed install, serialised
          # behind maxParallel=1, to arrive at a red job that said nothing about
          # any test.
          #
          # A repo that needs a package manager this runner does not have is
          # reported and SKIPPED, not failed. "These tests failed" and "these
          # tests could not be run here" are different facts, and a permanently
          # red job teaches everyone to ignore the colour — which costs more than
          # the gate was ever worth.
          if [ -f package.json ] && python3 -c "import json,sys; sys.exit(0 if 'test' in json.load(open('package.json')).get('scripts',{}) else 1)"; then
            if [ -f bun.lockb ] || [ -f bun.lock ]; then PM=bun
            elif [ -f pnpm-lock.yaml ]; then PM=pnpm
            elif [ -f yarn.lock ]; then PM=yarn
            else PM=npm
            fi
            echo "lockfile says $PM"
            if ! command -v "$PM" >/dev/null 2>&1; then
              echo "::warning::$PM is not installed on this runner — tests were NOT run for this commit"
              exit 0
            fi
            case "$PM" in
              bun)  bun install --frozen-lockfile || bun install; bun run test ;;
              pnpm) pnpm install --frozen-lockfile || pnpm install; pnpm test ;;
              yarn) yarn install --frozen-lockfile || yarn install; yarn test ;;
              *)    npm ci 2>/dev/null || npm install; npm test ;;
            esac
          else
            echo "no test script in package.json — nothing to run"
          fi
          PCT=""
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(python3 -c "import json; print(json.load(open('coverage/coverage-summary.json'))['total']['lines']['pct'])")
          elif [ -f coverage.xml ]; then
            PCT=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate', '0'))*100, 1))")
          fi
          if [ -z "$PCT" ]; then
            echo "no coverage report found — nothing to ratchet"
            exit 0
          fi
          curl -sS -X POST "${{ secrets.TARDIS_AGENT_URL }}/api/coverage" \
            -H "Authorization: Bearer ${{ secrets.TARDIS_CAPABILITY }}" \
            -H 'Content-Type: application/json' \
            -d "{\"branch\":\"${GITHUB_REF_NAME}\",\"pct\":$PCT,\"sha\":\"${GITHUB_SHA}\"}" -k || true

          # The ratchet: today may not be worse than the best day this project
          # has already had. No target to pick or defend, enforceable from the
          # first build, and it holds every gain. See workflow.yml for the longer
          # note on why a high-water mark and not the previous value.
          BASELINE=$(curl -sS -k -H "Authorization: Bearer ${{ secrets.TARDIS_CAPABILITY }}" \
            "${{ secrets.TARDIS_AGENT_URL }}/api/coverage/baseline" 2>/dev/null \
            | python3 -c "import json,sys; b=json.load(sys.stdin).get('baseline'); print('' if b is None else b)" 2>/dev/null || echo "")
          if [ -z "$BASELINE" ]; then
            echo "coverage $PCT% — first recorded on this project, nothing to compare against"
            exit 0
          fi
          python3 - "$PCT" "$BASELINE" <<'RATCHET'
          import sys
          pct, base = float(sys.argv[1]), float(sys.argv[2])
          TOLERANCE = 0.5
          if pct + TOLERANCE < base:
              print(f"::error::coverage regressed to {pct}% from the {base}% this project has already reached")
              print(f"add tests for what you changed, or explain the drop — tolerance is {TOLERANCE}pp")
              raise SystemExit(1)
          verb = "raised" if pct > base else "held"
          print(f"coverage {verb}: {pct}% against a high-water mark of {base}%")
          RATCHET

  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: verify the plan matches stack.yml
        run: |
          set -euo pipefail
          if [ ! -f .tardis/stack.lock.json ]; then
            echo "::error::.tardis/stack.lock.json is missing — run 'tardis stack plan' and commit it"
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, sys
          lock = json.load(open('.tardis/stack.lock.json'))
          actual = hashlib.sha256(open('.tardis/stack.yml','rb').read()).hexdigest()
          if lock.get('stackSha256') != actual:
              sys.exit("::error::stack.yml changed since the last 'tardis stack plan' — "
                       "re-run it and commit stack.lock.json, so what deploys is what was reviewed")
          print(f"plan verified: {len(lock['services'])} services")
          PY

      - name: build and mirror images
        env:
          REGISTRY: 192.168.29.114:5000
        run: |
          set -euo pipefail
          SLUG=$(python3 -c "import json; print(json.load(open('.tardis/project.json'))['slug'])")

          python3 -c "
          import json
          for s in json.load(open('.tardis/stack.lock.json'))['services']:
              b = s.get('build') or {}
              if b:
                  ctx = b.get('context', '.') if isinstance(b, dict) else str(b)
                  df  = b.get('dockerfile', 'Dockerfile') if isinstance(b, dict) else 'Dockerfile'
                  print(f\"{s['id']}\tbuild\t{ctx}\t{df}\")
              else:
                  print(f\"{s['id']}\tmirror\t{s.get('image','')}\t\")
          " > /tmp/services.txt

          : > /tmp/digests.txt
          while IFS=$'\t' read -r id kind a b; do
            target="$REGISTRY/tardis/$SLUG/$id"
            if [ "$kind" = build ]; then
              echo "::group::build $id"
              docker build -t "$target:git-$GITHUB_SHA" -f "$a/$b" "$a"
              echo "::endgroup::"
            else
              echo "::group::mirror $id ($a)"
              # --platform is explicit: pulling a multi-arch image without it
              # silently selects the runner's architecture, and re-pushing then
              # collapses the manifest list to that one arch. This node is amd64.
              docker pull --platform linux/amd64 "$a"
              docker tag "$a" "$target:git-$GITHUB_SHA"
              echo "::endgroup::"
            fi
            docker push "$target:git-$GITHUB_SHA"
            # Read the digest back from the REGISTRY, not from `docker inspect`.
            # A mirrored image carries its upstream RepoDigest (docker.io/...)
            # alongside the local one, and their order is not defined — taking
            # index 0 yields the upstream digest often enough to break the pull
            # with a digest that does not exist in this registry.
            DIGEST=$(curl -sS -I \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "http://$REGISTRY/v2/tardis/$SLUG/$id/manifests/git-$GITHUB_SHA" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}' | sed 's/^sha256://')
            if [ -z "$DIGEST" ]; then
              echo "::error::could not resolve pushed digest for $id from $REGISTRY"; exit 1
            fi
            printf '%s\t%s\n' "$id" "$DIGEST" >> /tmp/digests.txt
          done < /tmp/services.txt
          echo "resolved $(wc -l < /tmp/digests.txt) digests"

      - name: compile deployment intent
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only bounded application intent crosses the wire: ids, digests,
          # ports, literal env, volume ids, paths. The agent constructs every
          # registry path, object name, host and selector itself.
          python3 - <<'PY' > /tmp/intent.json
          import json, os
          lock = json.load(open('.tardis/stack.lock.json'))
          digests = dict(l.rstrip('\n').split('\t') for l in open('/tmp/digests.txt') if l.strip())
          services = []
          for s in lock['services']:
              out = {k: v for k, v in s.items() if k not in ('build', 'image') and v is not None}
              out['digest'] = digests[s['id']]
              services.append(out)
          print(json.dumps({
              'branch': os.environ['BRANCH'],
              'sha': os.environ['GITHUB_SHA'],
              'services': services,
              'volumes': lock['volumes'],
              'routes': lock['routes'],
          }))
          PY
          python3 -c "import json;d=json.load(open('/tmp/intent.json'));print('intent:',len(d['services']),'services,',len(d['routes']),'routes')"

      - name: deploy stack via project agent
        run: |
          # RETRY TRANSIENT FAILURES, BUT NEVER A SUPERSEDED ONE.
          #
          # The agent may be mid-rollout, so a retry is worth having. What a
          # retry can never fix is losing the push race: if a newer commit has
          # landed on this branch, the agent refuses this sha and will keep
          # refusing it, because the head has moved permanently. Sitting in the
          # loop then burns 50 seconds to arrive at a red build that means
          # nothing — and a red build that means nothing is worse than none,
          # because everything downstream reads CI as a signal.
          for attempt in 1 2 3 4 5; do
            if OUT=$(curl -sS --fail-with-body -X POST "${{ secrets.TARDIS_AGENT_URL }}/api/stack/deploy" \
                 -H "Authorization: Bearer ${{ secrets.TARDIS_CAPABILITY }}" \
                 -H 'Content-Type: application/json' \
                 --data-binary @/tmp/intent.json -k); then
              echo "$OUT"; echo "deployed on attempt $attempt"; exit 0
            fi
            echo "$OUT"
            if printf '%s' "$OUT" | grep -q '"superseded"[[:space:]]*:[[:space:]]*true'; then
              echo "a newer commit already owns this branch — nothing left to deploy, skipping"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 10s"; sleep 10
          done
          echo "stack deploy failed after 5 attempts"; exit 1

      - name: standards ratchet (main only)
        if: github.ref_name == 'main'
        run: |
          # THE STANDARD AS A RATCHET, NOT AS A BAR.
          #
          # Absolute compliance cannot gate a build here yet: projects on this
          # platform fail several dimensions today, and a gate that is red the
          # day it ships is one everybody learns to ignore. What IS enforceable
          # from the first run is direction — this commit may not fail more
          # dimensions than the best this project has already managed.
          #
          # Same shape as the coverage ratchet above, applied to the whole
          # standard. `tardis standards` shows the detail; this only guards
          # against getting worse.
          OUT=$(curl -sS -k -X POST "${{ secrets.TARDIS_AGENT_URL }}/api/standards/record" \
            -H "Authorization: Bearer ${{ secrets.TARDIS_CAPABILITY }}" \
            -H 'Content-Type: application/json' \
            -d "{\"branch\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}" 2>/dev/null) || {
              echo "::warning::could not reach the standards endpoint — not treating that as a regression"
              exit 0
            }
          printf '%s' "$OUT" > /tmp/standards.json
          python3 - <<'STANDARDS'
          import json
          d = json.load(open('/tmp/standards.json'))
          if d.get('baseline') is None:
              print('standards: {} failing, first record on this project'.format(d['fails']))
              raise SystemExit(0)
          if d.get('regressed'):
              print('::error::standards regressed: {} dimensions failing, best was {}'.format(d['fails'], d['baseline']))
              print('now failing: ' + ', '.join(d.get('failing', [])))
              raise SystemExit(1)
          print('standards held: {} failing against a best of {}'.format(d['fails'], d['baseline']))
          STANDARDS

      - name: sonarqube analysis (main only)
        if: github.ref_name == 'main' && env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SLUG=$(python3 -c "import json; print(json.load(open('.tardis/project.json'))['slug'])")
          # See workflow.yml for why both flags are needed: --volumes-from because
          # the checkout lives on a Docker volume at /workspace that the daemon
          # cannot bind by path, and the CA import because the scanner image does
          # not trust the homelab CA. Both used to fail silently behind a
          # `|| echo`; a scanner that did not run is not a pass, so they now fail
          # the job.
          #
          # The gate VERDICT stays reported until a project opts in with
          # TARDIS_SONAR_GATE=enforce — the stock gate wants 80% coverage on new
          # code and every project here is at 0.0%, so enforcing it today would
          # red every main build permanently. The coverage ratchet is the gate
          # that can pass now. workflow.yml carries the full reasoning.
          GATE=""
          if [ "${{ vars.TARDIS_SONAR_GATE }}" = "enforce" ]; then
            GATE="-Dsonar.qualitygate.wait=true"
            echo "quality gate: ENFORCED — a failing gate fails this build"
          else
            echo "quality gate: reported only — set repo variable TARDIS_SONAR_GATE=enforce to block on it"
            echo "               read the current verdict with: tardis quality"
          fi
          # BOUNDED, because this is what actually runs the box out of memory.
          #
          # Build 200 died with exit 137 — and the TypeScript build was not the
          # cause. The images built, the deploy ran, and the job was killed here,
          # in the scanner: a JVM analysing a 262k-line monorepo across 33
          # tsconfig files, with no heap ceiling, on a host with ~7GB free and its
          # swap already exhausted. An unbounded JVM grows until something dies.
          #
          # --memory bounds the container so a runaway is contained rather than
          # taken out of the host's hide, and -Xmx sits BELOW it so the JVM hits
          # its own ceiling first and reports an OutOfMemoryError naming the
          # analysis — which is diagnosable — instead of vanishing to SIGKILL,
          # which is not.
          #
          # Note what this failure cost: the job went red AFTER a successful
          # deploy, so "build-deploy failed" did not mean "the deploy did not
          # happen". Worth remembering before reading a red build as an undeployed
          # one.
          docker run --rm \
            --memory=4g --memory-swap=6g \
            --volumes-from "$(cat /etc/hostname)" \
            -e SONAR_HOST_URL="${{ secrets.SONAR_HOST_URL }}" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -e SONAR_SCANNER_OPTS="-Xmx3g -Djavax.net.ssl.trustStore=/tmp/tardis-truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=PKCS12" \
            -v /etc/ssl/tardis/ca.crt:/tmp/tardis-ca.crt:ro \
            -w "$PWD" \
            --entrypoint sh \
            sonarsource/sonar-scanner-cli:11 -c '
              keytool -importcert -noprompt -trustcacerts \
                -alias tardis -file /tmp/tardis-ca.crt \
                -keystore /tmp/tardis-truststore.p12 -storetype PKCS12 -storepass changeit >/dev/null &&
              sonar-scanner "$@"
            ' sh -Dsonar.projectKey=tardis-$SLUG -Dsonar.projectBaseDir="$PWD" \
                 -Dsonar.working.directory=/tmp/scannerwork $GATE
