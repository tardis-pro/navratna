global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: llm-service
    metrics_path: /metrics
    static_configs:
      - targets: ['uaip-llm-service:3007']

  - job_name: node-exporter
    static_configs:
      - targets: ['uaip-node-exporter:9100']

  - job_name: redis-exporter
    static_configs:
      - targets: ['uaip-redis-exporter:9121']

  - job_name: postgres-exporter
    static_configs:
      - targets: ['uaip-postgres-exporter:9187']

  - job_name: nginx-exporter
    static_configs:
      - targets: ['uaip-nginx-exporter:9113']
